name: Auto TikTok Shorts Producer (3 Golden Hours / Day)

on:
  schedule:
    # 3 Khung Giờ Vàng Việt Nam (GMT+7) - Khoảng cách an toàn >= 5.5 tiếng (Chuẩn chống spam TikTok):
    # - Ca Sáng: 06:00 VN (23:00 UTC hôm trước) -> Đăng lúc 06:20 - 06:45 Sáng (Trọng tâm 06:30)
    # - Ca Trưa: 12:00 VN (05:00 UTC)           -> Đăng lúc 12:20 - 12:45 Trưa
    # - Ca Tối:  20:00 VN (13:00 UTC)           -> Đăng lúc 20:20 - 20:45 Tối
    - cron: '0 23,5,13 * * *'
  workflow_dispatch:
    inputs:
      test_now:
        description: 'Đăng ngay lập tức để kiểm tra (true: shareNow, false: hẹn giờ ngẫu nhiên)'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: auto-shorts-pipeline
  cancel-in-progress: false

jobs:
  produce_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1. Tải mã nguồn dự án
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: 2. Cài đặt môi trường Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. Cài đặt FFmpeg trên máy chủ Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 4. Cài đặt các thư viện phụ thuộc
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 5. Chạy quy trình Tự Động Tạo & Đăng Video lên TikTok
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          TEST_NOW: ${{ github.event.inputs.test_now || 'false' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python headless_producer.py

      - name: 6. Keep-Alive vĩnh viễn & Lưu lịch sử chống trùng lặp
        run: |
          git config user.name "AutoProducer-Bot"
          git config user.email "bot@autoproducer.local"
          git add database/used_history.json
          git commit -m "Auto: Update video history [skip ci]" || echo "Không có thay đổi lịch sử"
          git push origin HEAD || echo "Không thể push hoặc không có thay đổi"
